version: '3.9'
name: BotJDE

networks:
  db:
    driver: bridge
volumes:
  logs:
  db:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ~/Dev/dbs/botjde

services:
  botjde:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-}
    image: botjde:latest
    container_name: botjde
    restart: unless-stopped
    networks:
      - db
    ports:
      - "8080:8080"
    env_file:
      - ./.env.prod
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - JDBC_URL=${JDBC_URL:-jdbc:postgresql://database:5432/botjde}
      - JDBC_USER=${POSTGRES_USER}
      - JDBC_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Duser.timezone=America/New_York
      - TZ=America/New_York
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ../logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      database:
        condition: service_healthy
  botjde-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-}
    image: botjde:dev
    container_name: botjde-dev
    restart: unless-stopped
    networks:
      - db
    ports:
      - "8081:8080" # map dev to host 8081 so prod can use 8080
    env_file:
      - ./.env.dev
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - JDBC_URL=${JDBC_URL:-jdbc:postgresql://database:5432/botjde_dev}
      - JDBC_USER=${POSTGRES_USER}
      - JDBC_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_PROFILES_ACTIVE=dev
      - JAVA_OPTS=-Duser.timezone=America/New_York
      - TZ=America/New_York
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - ../logs/dev:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      database:
        condition: service_healthy
  database:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_DB: botjde
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - db
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d botjde -U ${POSTGRES_USER}" ]
      interval: 30s
      timeout: 10s
      retries: 5